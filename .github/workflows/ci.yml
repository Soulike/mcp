name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['24', '26']
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v3
        with:
          runtime: node@${{ matrix.node-version }}
          cache: true
          require-lockfile: true
      - run: pnpm verify

  ci_gate:
    name: CI gate
    if: always()
    needs: [verify]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Require completed Verify matrix
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          if [ "$VERIFY_RESULT" != success ]; then
            printf 'Verify did not succeed (%s).\n' "${VERIFY_RESULT:-missing}" >&2
            exit 1
          fi
