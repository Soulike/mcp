name: Release @soulike/deepseek-web-mcp

on:
  workflow_dispatch:
    inputs:
      finalize_existing:
        description: Skip npm publish and finalize a missing GitHub Release for an already-published version on main
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    uses: ./.github/workflows/release-mcp.yml
    permissions:
      contents: write
      id-token: write
    with:
      package-dir: servers/deepseek-web-mcp
      finalize_existing: ${{ inputs.finalize_existing }}
