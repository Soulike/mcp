name: Release MCP Server

on:
  workflow_call:
    inputs:
      package-dir:
        description: Workspace directory under servers/ to release (e.g. servers/deepseek-web-mcp)
        required: true
        type: string

permissions: {}

jobs:
  release:
    name: Release MCP package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          printf 'Releases may only be triggered from main (got %s).\n' "$REF" >&2
          exit 1

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: false
          save-cache: false
          require-lockfile: true

      - name: Read package metadata and verify release target
        id: meta
        env:
          PACKAGE_DIR: ${{ inputs.package-dir }}
        run: |
          node --input-type=module - <<'EOF'
          import { appendFileSync, readFileSync } from 'node:fs';
          import { basename } from 'node:path';
          import { createRequire } from 'node:module';

          const packageDir = process.env.PACKAGE_DIR ?? '';
          if (!/^servers\/[^/]+$/.test(packageDir)) {
            throw new Error(`Invalid package-dir "${packageDir}". Expected "servers/<name>".`);
          }

          const manifest = JSON.parse(readFileSync(`${packageDir}/package.json`, 'utf8'));
          if (manifest.private === true) {
            throw new Error(`Cannot release private package "${manifest.name}".`);
          }
          if (typeof manifest.name !== 'string' || manifest.name === '') {
            throw new Error(`Missing package name in ${packageDir}/package.json.`);
          }
          if (typeof manifest.version !== 'string' || manifest.version === '') {
            throw new Error(`Missing package version in ${packageDir}/package.json.`);
          }

          const require = createRequire(`${process.cwd()}/scripts/check-server-versions/package.json`);
          const semver = require('semver');
          if (
            manifest.version.trim() !== manifest.version ||
            /^[=v]/i.test(manifest.version) ||
            semver.valid(manifest.version) === null
          ) {
            throw new Error(`Invalid Semver version "${manifest.version}" in ${packageDir}/package.json.`);
          }

          const repoUrl = typeof manifest.repository === 'string'
            ? manifest.repository
            : manifest.repository?.url;
          if (typeof repoUrl !== 'string' || !repoUrl.includes('github.com/Soulike/mcp')) {
            throw new Error(`Expected repository.url pointing to Soulike/mcp in ${packageDir}/package.json for npm OIDC/provenance.`);
          }

          const encodedPkg = encodeURIComponent(manifest.name);
          const response = await fetch(`https://registry.npmjs.org/${encodedPkg}/${manifest.version}`);
          if (response.status === 200) {
            throw new Error(`${manifest.name}@${manifest.version} is already published on npm.`);
          }
          if (response.status !== 404) {
            throw new Error(`Unexpected npm registry status ${response.status} checking ${manifest.name}@${manifest.version}.`);
          }

          const tag = `${basename(packageDir)}@${manifest.version}`;
          const outputPath = process.env.GITHUB_OUTPUT;
          if (!outputPath) {
            throw new Error('GITHUB_OUTPUT is not set.');
          }
          appendFileSync(outputPath, `name=${manifest.name}\n`);
          appendFileSync(outputPath, `version=${manifest.version}\n`);
          appendFileSync(outputPath, `tag=${tag}\n`);
          EOF

      - name: Verify release tag does not already exist
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          if [ -n "$(git ls-remote --tags origin "refs/tags/${TAG}")" ]; then
            printf 'Git tag %s already exists on origin.\n' "${TAG}" >&2
            exit 1
          fi

      - run: pnpm verify

      - name: Pack release tarball
        env:
          PKG_NAME: ${{ steps.meta.outputs.name }}
        run: |
          rm -rf /tmp/npm-release
          mkdir -p /tmp/npm-release
          pnpm --filter "${PKG_NAME}" pack --pack-destination /tmp/npm-release

      - name: Publish to npm via OIDC Trusted Publishing
        run: |
          cd /tmp/npm-release
          node -v
          npm -v
          npm publish ./*.tgz --access public

      - name: Create GitHub Release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          PKG_NAME: ${{ steps.meta.outputs.name }}
          PKG_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "${PKG_NAME}@${PKG_VERSION}" \
            --generate-notes
