name: Release MCP Server

on:
  workflow_call:
    inputs:
      package-dir:
        description: Workspace directory under servers/ to release (e.g. servers/deepseek-web-mcp)
        required: true
        type: string
      finalize_existing:
        description: Skip npm publish and finalize missing GitHub tag/release for an already-published version on this commit
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  publish:
    name: Validate and publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      name: ${{ steps.meta.outputs.name }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v5
        with:
          version: '^12.0.0'

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false

      - run: pnpm install --frozen-lockfile

      - name: Prepare and validate release
        id: meta
        env:
          PACKAGE_DIR: ${{ inputs.package-dir }}
          FINALIZE_EXISTING: ${{ inputs.finalize_existing }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-mcp/src/prepare-release.ts --package-dir "$PACKAGE_DIR" --require-ref refs/heads/main --target-sha "$GITHUB_SHA"

      - if: steps.meta.outputs.skip_npm_publish != 'true'
        run: pnpm verify

      - name: Pack release tarball
        if: steps.meta.outputs.skip_npm_publish != 'true'
        env:
          PKG_NAME: ${{ steps.meta.outputs.name }}
        run: |
          rm -rf /tmp/npm-release
          mkdir -p /tmp/npm-release
          pnpm --filter "${PKG_NAME}" pack --pack-destination /tmp/npm-release

      - name: Publish to npm via OIDC Trusted Publishing
        if: steps.meta.outputs.skip_npm_publish != 'true'
        run: |
          cd /tmp/npm-release
          node -v
          npm -v
          npm publish ./*.tgz --access public

  finalize:
    name: Create GitHub Release
    needs: [publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create GitHub Release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.publish.outputs.tag }}
          PKG_NAME: ${{ needs.publish.outputs.name }}
          PKG_VERSION: ${{ needs.publish.outputs.version }}
        run: |
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "${PKG_NAME}@${PKG_VERSION}" \
            --generate-notes
