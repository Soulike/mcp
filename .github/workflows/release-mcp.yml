name: Release MCP Server

on:
  workflow_call:
    inputs:
      package-dir:
        description: Workspace directory under servers/ to release (e.g. servers/deepseek-web-mcp)
        required: true
        type: string

permissions: {}

jobs:
  release:
    name: Release MCP package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: pnpm/setup@v3
        with:
          version: '^12.0.0'
          runtime: node@24
          cache: false
          save-cache: false
          require-lockfile: true

      - name: Prepare and validate release
        id: meta
        env:
          PACKAGE_DIR: ${{ inputs.package-dir }}
        run: node scripts/release-mcp/src/prepare-release.ts --package-dir "$PACKAGE_DIR" --require-ref refs/heads/main

      - run: pnpm verify

      - name: Pack release tarball
        env:
          PKG_NAME: ${{ steps.meta.outputs.name }}
        run: |
          rm -rf /tmp/npm-release
          mkdir -p /tmp/npm-release
          pnpm --filter "${PKG_NAME}" pack --pack-destination /tmp/npm-release

      - name: Publish to npm via OIDC Trusted Publishing
        run: |
          cd /tmp/npm-release
          node -v
          npm -v
          npm publish ./*.tgz --access public

      - name: Create GitHub Release and tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          PKG_NAME: ${{ steps.meta.outputs.name }}
          PKG_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          gh release create "${TAG}" \
            --target "${GITHUB_SHA}" \
            --title "${PKG_NAME}@${PKG_VERSION}" \
            --generate-notes
